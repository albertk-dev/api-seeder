[project]
name = "api-seeder"
version = "1.0.0"
description = "Un outil CLI pour ensemencer une application avec des données Excel via une API, en gérant les dépendances."
authors = [
    { name = "Albertk", email = "albertk.explorer@gmail.com" },
]
requires-python = ">=3.8"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",
    "requests>=2.28.0",
]

[project.scripts]
api-seeder = "api_seeder.main:cli_entry_point"